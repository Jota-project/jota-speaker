name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg
        # apt mirrors on hosted runners sometimes hang forever; time-box each attempt and retry.
        timeout-minutes: 8
        run: |
          for i in 1 2 3; do
            timeout 120 sudo apt-get update && timeout 120 sudo apt-get install -y --no-install-recommends ffmpeg && break
            sleep 5
          done
          command -v ffmpeg

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/
        env:
          PYTHONPATH: .

      - name: Unit tests
        run: python3 -m pytest tests/unit/ -v
        env:
          JOTA_ENGINE: mock
          JOTA_AUTH_PROVIDER: stub
          PYTHONPATH: .

      - name: Integration tests
        run: python3 -m pytest tests/integration/ -v
        env:
          JOTA_ENGINE: mock
          JOTA_AUTH_PROVIDER: stub
          PYTHONPATH: .
