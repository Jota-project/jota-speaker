name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ffmpeg
        # Static build from GitHub Releases: apt mirrors on hosted runners kept hanging.
        timeout-minutes: 3
        run: |
          curl -fsSL --retry 3 --max-time 120 https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz \
            | tar -xJ -C "$RUNNER_TEMP" --strip-components=2 --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/ffmpeg" -version > /dev/null && "$RUNNER_TEMP/ffprobe" -version > /dev/null

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/
        env:
          PYTHONPATH: .

      - name: Unit tests
        run: python3 -m pytest tests/unit/ -v
        env:
          JOTA_ENGINE: mock
          JOTA_AUTH_PROVIDER: stub
          PYTHONPATH: .

      - name: Integration tests
        run: python3 -m pytest tests/integration/ -v
        env:
          JOTA_ENGINE: mock
          JOTA_AUTH_PROVIDER: stub
          PYTHONPATH: .

      - name: OpenAI API tests
        run: python3 -m pytest tests/openai/ -v -rs
        env:
          JOTA_ENGINE: mock
          JOTA_AUTH_PROVIDER: stub
          PYTHONPATH: .
