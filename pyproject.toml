[project]
name = "jota-speaker"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.51.0",
    "websockets>=16.0",
    "pydantic-settings>=2.14.2",
    "kokoro-onnx>=0.5.0",
    "numpy>=2.4.6",
    "httpx>=0.28.1",
    "num2words>=0.5.14",
    "prometheus-client>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
    "respx>=0.23.1",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
